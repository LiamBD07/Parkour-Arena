# Render Blueprint: create one Node web service from this repository.
# Use a Neon database in the same region. Do not create a Render disk: data lives in Neon.
services:
  - type: web
    name: parkour-arena
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
